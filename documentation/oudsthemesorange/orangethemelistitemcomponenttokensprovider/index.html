<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OrangeThemeListItemComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="A class which wraps all component tokens for list item components like `OUDSListItem` and `OUDSSmallListItem`. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllListItemComponentTokensProvider` implementation inside `OUDSTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `OUDSTheme` implementation to use. Custom themes can use subclass of ``doc://OUDSThemesOrange/documentation/OUDSThemesOrange/OrangeThemeListItemComponentTokensProvider`` and apply the provider they need. It implements also the protocol `ListItemComponentTokens` so as to expose the component tokens for list item components through any `OUDSTheme`. Such component tokens are defined with raw and semantic tokens of sizes (from `AllSizeSemanticTokensProvider`), borders (from `AllBorderSemanticTokensProvider`), colors (from `AllColorSemanticTokensProvider`), spaces (from `AllSpaceSemanticTokensProvider`), opacities (from `AllOpacitySemanticTokensProvider`) and dimensions (from `AllDimensionSemanticTokensProvider`)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme Orange</a></li><li>OrangeThemeListItemComponentTokensProvider</li></ul><p>Class</p><h1>OrangeThemeListItemComponentTokensProvider</h1><p>A class which wraps all <b>component tokens</b> for list item components like <code>OUDSListItem</code> and <code>OUDSSmallListItem</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllListItemComponentTokensProvider</code> implementation inside <code>OUDSTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>OUDSTheme</code> implementation to use. Custom themes can use subclass of <a href="."><code>OrangeThemeListItemComponentTokensProvider</code></a> and apply the provider they need. It implements also the protocol <code>ListItemComponentTokens</code> so as to expose the component tokens for list item components through any <code>OUDSTheme</code>. Such component tokens are defined with raw and semantic tokens of sizes (from <code>AllSizeSemanticTokensProvider</code>), borders (from <code>AllBorderSemanticTokensProvider</code>), colors (from <code>AllColorSemanticTokensProvider</code>), spaces (from <code>AllSpaceSemanticTokensProvider</code>), opacities (from <code>AllOpacitySemanticTokensProvider</code>) and dimensions (from <code>AllDimensionSemanticTokensProvider</code>).</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>class OrangeThemeListItemComponentTokensProvider</code></pre></section><h2>Overview</h2><pre class="swift"><code>    // Define your own provider for list item component tokens
    // by inheriting from existing provider
    class CustomListItemComponentTokensProvider: OrangeThemeListItemComponentTokensProvider {

        // Then override the list item component tokens you want.

        override var sizeMinHeightDefault: SizeSemanticToken { DimensionRawTokens._750 }

        override var colorBgCurrentFocus: MultipleColorSemanticToken { colors.actionSupportFocus }

        override var spaceRowGap: SpaceSemanticToken { spaces.rowGapNone }

        // ...
    }

    // Or define your own provider from scratch
    class CustomListItemComponentTokensProvider: ListItemComponentTokens {

        // And implement all tokens.
        // You are allowed to give semantic tokens providers if you want to define values.
    }
</code></pre><p>Then, you can give this <code>CustomListItemComponentTokensProvider</code> to your own theme implementation:</p><pre class="swift"><code>class LocalTheme: OrangeTheme {

    override init() {
        super.init(listItem: CustomListItemComponentTokensProvider())
    }
}
</code></pre><p>or to an already existing theme for example:</p><pre class="swift"><code>    OrangeTheme(listItem: CustomListItemComponentTokensProvider())
</code></pre><p>It is also possible to use your own semantic tokens providers for this component tokens provider:</p><pre class="swift"><code>    // Uses by default here:
    // - OrangeThemeSizeSemanticTokensProvider for sizes
    // - OrangeThemeBorderSemanticTokensProvider for borders
    // - OrangeThemeColorSemanticTokensProvider for colors
    // - OrangeThemeSpaceSemanticTokensProvider for spaces
    // - OrangeThemeOpacitySemanticTokensProvider for opacities
    // - OrangeThemeDimensionSemanticTokensProvider for dimensions
    let listItemComponentTokensProvider = OrangeThemeListItemComponentTokensProvider()

    // Or use your own semantic tokens providers (or only some)
    let listItemComponentTokensProvider = OrangeThemeListItemComponentTokensProvider(
                                              sizes: CustomSizeSemanticTokensProvider(),
                                              borders: CustomBorderSemanticTokensProvider(),
                                              colors: CustomColorSemanticTokensProvider(),
                                              spaces: CustomSpaceSemanticTokensProvider())
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(sizes:borders:colors:spaces:opacities:dimensions:)/index.html"><code>init(sizes: AllSizeSemanticTokensProvider?, borders: AllBorderSemanticTokensProvider?, colors: AllColorSemanticTokensProvider?, spaces: AllSpaceSemanticTokensProvider?, opacities: AllOpacitySemanticTokensProvider?, dimensions: AllDimensionSemanticTokensProvider?)</code></a><p>Defines a provider of component tokens dedicated to list item components.</p></li></ul><h3>Instance Properties</h3><ul><li><a href="borders/index.html"><code>let borders: AllBorderSemanticTokensProvider</code></a><p>Provider of border semantic tokens to use for list item borders</p></li><li><a href="colors/index.html"><code>let colors: AllColorSemanticTokensProvider</code></a><p>Provider of color semantic tokens to use for list item colors</p></li><li><a href="dimensions/index.html"><code>let dimensions: AllDimensionSemanticTokensProvider</code></a><p>Provider of dimension semantic tokens to use for list item dimensions</p></li><li><a href="opacities/index.html"><code>let opacities: AllOpacitySemanticTokensProvider</code></a><p>Provider of opacity semantic tokens to use for list item opacities</p></li><li><a href="sizes/index.html"><code>let sizes: AllSizeSemanticTokensProvider</code></a><p>Provider of size semantic tokens to use for list item sizes</p></li><li><a href="spaces/index.html"><code>let spaces: AllSpaceSemanticTokensProvider</code></a><p>Provider of space semantic tokens to use for list item spaces</p></li></ul></article></noscript><div id="app"></div></body></html>

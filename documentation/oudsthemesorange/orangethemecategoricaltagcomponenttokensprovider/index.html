<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OrangeThemeCategoricalTagComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="A class which wraps all component  tokens of categorical tag for tag objects like `OUDSCategoricalTag`. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllCategoricalTagComponentTokensProvider` implementation inside `OUDSTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `OUDSTheme` implementation to use. Custom themes can use subclass of ``doc://OUDSThemesOrange/documentation/OUDSThemesOrange/OrangeThemeCategoricalTagComponentTokensProvider`` and apply the provider they need. It implements also the protocol `CategoricalTagComponentTokens` so as to expose the component tokens for categorical tags through any `OUDSTheme`. Categorical tags components tokens are defined with semantic tokens of colors (`AllColorSemanticTokensProvider`)" name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme Orange</a></li><li>OrangeThemeCategoricalTagComponentTokensProvider</li></ul><p>Class</p><h1>OrangeThemeCategoricalTagComponentTokensProvider</h1><p>A class which wraps all <b>component  tokens of categorical tag</b> for <i>tag</i> objects like <code>OUDSCategoricalTag</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllCategoricalTagComponentTokensProvider</code> implementation inside <code>OUDSTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>OUDSTheme</code> implementation to use. Custom themes can use subclass of <a href="."><code>OrangeThemeCategoricalTagComponentTokensProvider</code></a> and apply the provider they need. It implements also the protocol <code>CategoricalTagComponentTokens</code> so as to expose the component tokens for <i>categorical tags</i> through any <code>OUDSTheme</code>. <i>Categorical tags</i> components tokens are defined with semantic tokens of colors (<code>AllColorSemanticTokensProvider</code>)</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>class OrangeThemeCategoricalTagComponentTokensProvider</code></pre></section><h2>Overview</h2><pre class="swift"><code>    // Define your own provider for categorical tag component tokens
    // by inheriting from existing provider
    class CustomCategoricalTagComponentTokensProvider: OrangeThemeCategoricalTagComponentTokensProvider {

        // Then override the categorical tag component tokens you want.
        override var colorContent: MultipleColorSemanticToken { MultipleColorSemanticToken(colors.repositoryNeutralEmphasizedBlack) }

        // ...
    }

    // Or define your own provider from scratch
    class CustomCategoricalTagComponentTokensProvider: CategoricaTagComponentTokens {

        // And implement maybe hundreds of tokens.
        // You are allowed to use semantic tokens providers if you want to define values.
    }
</code></pre><p>Then, you can give this <code>CustomCategoricalTagComponentTokensProvider</code> to your own theme implementation:</p><pre class="swift"><code>class LocalTheme: OrangeTheme {

    override init() {
        super.init(categoricalTag: CustomCategoricalTagComponentTokensProvider())
    }
}
</code></pre><p>or to an already existing theme for example:</p><pre class="swift"><code>    OrangeTheme(categoricalTag: CustomCategoricalTagComponentTokensProvider())
</code></pre><p>It is also possible to use your own semantic tokens providers for this component tokens providers:</p><pre class="swift"><code>    // Uses by default here:

</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(colors:)/index.html"><code>init(colors: AllColorSemanticTokensProvider?)</code></a><p>Defines a provider of component tokens dedicated to <code>OUDSCategoricalTag</code></p></li></ul><h3>Instance Properties</h3><ul><li><a href="colors/index.html"><code>let colors: AllColorSemanticTokensProvider</code></a><p>Provider of color semantic tokens to use</p></li></ul></article></noscript><div id="app"></div></body></html>

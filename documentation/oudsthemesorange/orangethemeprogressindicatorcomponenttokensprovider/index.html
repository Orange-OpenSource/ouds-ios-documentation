<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OrangeThemeProgressIndicatorComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A class which wraps all component  tokens of progress indicators for circular progress  and linear progresscomponents. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllProgressIndicatorComponentTokensProvider` implementation inside `OUDSTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `OUDSTheme` implementation to use. Custom themes can use subclass of ``doc://OUDSThemesOrange/documentation/OUDSThemesOrange/OrangeThemeProgressIndicatorComponentTokensProvider`` and apply the provider they need. It implements also the protocol `ProgressIndicatorComponentTokens` so as to expose the component tokens for progress indicators through any `OUDSTheme`. Progress indicators components tokens are defined with semantic tokens spaces (from `AllSpaceSemanticTokensProvider`), sizes (from `AllSizeSemanticTokensProvider`), borders (from `AllBorderSemanticTokensProvider`), colors (from `AllColorSemanticTokensProvider`) and dimensions (from `AllDimensionSemanticTokensProvider`)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme Orange</a></li><li>OrangeThemeProgressIndicatorComponentTokensProvider</li></ul><p>Class</p><h1>OrangeThemeProgressIndicatorComponentTokensProvider</h1><p>A class which wraps all <b>component  tokens of progress indicators</b> for <i>circular progress</i>  and <i>linear progress</i>components. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllProgressIndicatorComponentTokensProvider</code> implementation inside <code>OUDSTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>OUDSTheme</code> implementation to use. Custom themes can use subclass of <a href="."><code>OrangeThemeProgressIndicatorComponentTokensProvider</code></a> and apply the provider they need. It implements also the protocol <code>ProgressIndicatorComponentTokens</code> so as to expose the component tokens for <i>progress indicators</i> through any <code>OUDSTheme</code>. <i>Progress indicators</i> components tokens are defined with semantic tokens spaces (from <code>AllSpaceSemanticTokensProvider</code>), sizes (from <code>AllSizeSemanticTokensProvider</code>), borders (from <code>AllBorderSemanticTokensProvider</code>), colors (from <code>AllColorSemanticTokensProvider</code>) and dimensions (from <code>AllDimensionSemanticTokensProvider</code>).</p><pre><code>class OrangeThemeProgressIndicatorComponentTokensProvider</code></pre></section><h2>Overview</h2><pre class="swift"><code>    // Define your own provider for progress indicator component tokens
    // by inheriting from existing provider
    class CustomProgressIndicatorComponentTokensProvider: OrangeThemeProgressIndicatorComponentTokensProvider {

        // Then override the accordion component tokens you want.

        override var spacePaddingBlockBottomExpandContainerDefault: SpaceSemanticToken { DimensionRawTokens._100 }

        // ...
    }

    // Or define your own provider from scratch
    class CustomProgressIndicatorComponentTokensProvider: AllProgressIndicatorComponentTokens {

        // And implement hundreds of tokens.
        // You are allowed to give semantic tokens providers if you want to define values.
    }
</code></pre><p>Then, you can give this <code>CustomProgressIndicatorComponentTokensProvider</code> to your own theme implementation:</p><pre class="swift"><code>class LocalTheme: OrangeTheme {

    override init() {
        super.init(progressIndicator: CustomProgressIndicatorComponentTokensProvider())
    }
}
</code></pre><p>or to an already existing theme for example:</p><pre class="swift"><code>    OrangeTheme(progressIndicator: CustomProgressIndicatorComponentTokensProvider())
</code></pre><p>It is also possible to use your own semantic tokens providers for this component tokens providers:</p><pre class="swift"><code>    // Uses by default here:
    // - OrangeThemeSizeSemanticTokensProvider for sizes
    // - OrangeThemeBorderSemanticTokensProvider for borders
    // - OrangeThemeColorSemanticTokensProvider for colors
    // - OrangeThemeSpaceSemanticTokensProvider for spaces
    // - OrangeThemeDimensionSemanticTokensProvider for dimensions
    let progressIndicatorComponentTokensProvider = OrangeThemeProgressIndicatorComponentTokensProvider()

    // Or use your own semantic tokens providers
    let progressIndicatorComponentTokensProvider = OrangeThemeProgressIndicatorComponentTokensProvider(
                    sizes: CustomSizeSemanticTokensProvider(),
                    spaces: CustomSpaceSemanticTokensProvider())
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(sizes:borders:colors:spaces:dimensions:)/index.html"><code>init(sizes: (any AllSizeSemanticTokensProvider)?, borders: (any AllBorderSemanticTokensProvider)?, colors: (any AllColorSemanticTokensProvider)?, spaces: (any AllSpaceSemanticTokensProvider)?, dimensions: (any AllDimensionSemanticTokensProvider)?)</code><p>Defines a provider of component tokens dedicated to progress indicators.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="borders/index.html"><code>let borders: any AllBorderSemanticTokensProvider</code><p>Provider of border semantic tokens to use for progress indicator borders</p></a></li><li><a href="colors/index.html"><code>let colors: any AllColorSemanticTokensProvider</code><p>Provider of color semantic tokens to use for progress indicator colors</p></a></li><li><a href="dimensions/index.html"><code>let dimensions: any AllDimensionSemanticTokensProvider</code><p>Provider of dimensions semantic tokens to use for progress indicator dimensions</p></a></li><li><a href="sizes/index.html"><code>let sizes: any AllSizeSemanticTokensProvider</code><p>Provider of size semantic tokens to use for progress indicator sizes</p></a></li><li><a href="spaces/index.html"><code>let spaces: any AllSpaceSemanticTokensProvider</code><p>Provider of spaces semantic tokens to use for progress indicator spaces</p></a></li></ul></article></noscript><div id="app"></div></body></html>

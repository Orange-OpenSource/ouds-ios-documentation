<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OrangeThemeToastComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="A class which wraps all component  tokens of toast for toast objects like `OUDSToast`. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllToastComponentTokensProvider` implementation inside `OUDSTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `OUDSTheme` implementation to use. Custom themes can use subclass of ``doc://OUDSThemesOrange/documentation/OUDSThemesOrange/OrangeThemeToastComponentTokensProvider`` and apply the provider they need. It implements also the protocol `ToastComponentTokens` so as to expose the component tokens for toast through any `OUDSTheme`. Toast components tokens are defined with semantic tokens of borders (`AllBorderSemanticTokensProvider`), dimensions (`AllDimensionSemanticTokensProvider`) and sizes (from `AllSizeSemanticTokensProvider`)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme Orange</a></li><li>OrangeThemeToastComponentTokensProvider</li></ul><p>Class</p><h1>OrangeThemeToastComponentTokensProvider</h1><p>A class which wraps all <b>component  tokens of toast</b> for <i>toast</i> objects like <code>OUDSToast</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllToastComponentTokensProvider</code> implementation inside <code>OUDSTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>OUDSTheme</code> implementation to use. Custom themes can use subclass of <a href="."><code>OrangeThemeToastComponentTokensProvider</code></a> and apply the provider they need. It implements also the protocol <code>ToastComponentTokens</code> so as to expose the component tokens for <i>toast</i> through any <code>OUDSTheme</code>. <i>Toast</i> components tokens are defined with semantic tokens of borders (<code>AllBorderSemanticTokensProvider</code>), dimensions (<code>AllDimensionSemanticTokensProvider</code>) and sizes (from <code>AllSizeSemanticTokensProvider</code>).</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>class OrangeThemeToastComponentTokensProvider</code></pre></section><h2>Overview</h2><pre class="swift"><code>    // Define your own provider for toast component tokens
    // by inheriting from existing provider
    class CustomToastComponentTokensProvider: OrangeThemeToastComponentTokensProvider {

        // Then override the toast component tokens you want.

        override var sizeAssetSmall: SizeSemanticToken { DimensionRawTokens._100 }

        override var borderRadiusMedia: BorderRadiusSemanticToken { BorderRawTokens.borderRadius0 }

        // ...
    }

    // Or define your own provider from scratch
    class CustomToastComponentTokensProvider: ToastComponentTokens {

        // And implement hundreds of tokens.
        // You are allowed to give semantic tokens providers if you want to define values.
    }
</code></pre><p>Then, you can give this <code>CustomToastComponentTokensProvider</code> to your own theme implementation:</p><pre class="swift"><code>class LocalTheme: OrangeTheme {

    override init() {
        super.init(toast: CustomToastComponentTokensProvider())
    }
}
</code></pre><p>or to an already existing theme for example:</p><pre class="swift"><code>    OrangeTheme(toast: CustomToastComponentTokensProvider())
</code></pre><p>It is also possible to use your own semantic tokens providers for this component tokens providers:</p><pre class="swift"><code>    // Uses by default here:
    // - OrangeThemeBorderSemanticTokensProvider for borders
    // - OrangeThemeDimensionSemanticTokensProvider for dimensions
    // - OrangeThemeSizeSemanticTokensProvider for sizes
    let toastComponentTokensProvider = OrangeThemeToastComponentTokensProvider()

    // Or use your own border, dimension and size semantic tokens providers
    let toastComponentTokensProvider = OrangeThemeToastComponentTokensProvider(
                    borders: CustomBorderSemanticTokensProvider(),
                    dimensions: CustomDimensionSemanticTokensProvider(),
                    sizes: CustomSizeSemanticTokensProvider())
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(borders:dimensions:sizes:)/index.html"><code>init(borders: AllBorderSemanticTokensProvider?, dimensions: AllDimensionSemanticTokensProvider?, sizes: AllSizeSemanticTokensProvider?)</code></a><p>Defines a provider of component tokens dedicated to <code>OUDSToast</code></p></li></ul><h3>Instance Properties</h3><ul><li><a href="borders/index.html"><code>let borders: AllBorderSemanticTokensProvider</code></a><p>Provider of borders semantic tokens to use for toast borders</p></li><li><a href="dimensions/index.html"><code>let dimensions: AllDimensionSemanticTokensProvider</code></a><p>Provider of <i>dimensions</i> semantic tokens to use for sizes as the Swift package exposes “closed” tokens of Figma</p></li><li><a href="sizes/index.html"><code>let sizes: AllSizeSemanticTokensProvider</code></a><p>Provider of sizes semantic tokens to use for toast sizes</p></li></ul></article></noscript><div id="app"></div></body></html>

<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OrangeThemeElevationSemanticTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="A class which wraps all elevation semantic tokens, multiple, composite or not, and expose them. This provider should be integrated as a `AllElevationSemanticTokensProvider` implementation inside `OUDSTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `OUDSTheme` implementation to use." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme Orange</a></li><li>OrangeThemeElevationSemanticTokensProvider</li></ul><p>Class</p><h1>OrangeThemeElevationSemanticTokensProvider</h1><p>A class which wraps all <b>elevation semantic tokens</b>, <i>multiple</i>, <i>composite</i> or not, and expose them. This provider should be integrated as a <code>AllElevationSemanticTokensProvider</code> implementation inside <code>OUDSTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>OUDSTheme</code> implementation to use.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>class OrangeThemeElevationSemanticTokensProvider</code></pre></section><h2>Overview</h2><pre class="swift"><code>    // Define your own provider for elevation semantic tokens
    class CustomElevationTokensProvider: OrangeThemeElevationSemanticTokensProvider {

        // Then override the elevation semantic tokens you want, using the elevation raw tokens available

        override var stickyEmphasized: ElevationCompositeSemanticToken {
            ElevationCompositeSemanticToken(ElevationRawTokens.bottom_4_600)
        }
}
</code></pre><p>Then, you can give this <code>CustomElevationTokensProvider</code> to your own theme implementation:</p><pre class="swift"><code>class LocalTheme: OrangeTheme {

    override init() {
        super.init(elevations: CustomElevationTokensProvider())
    }
}
</code></pre><p>or to an already existing theme for example:</p><pre class="swift"><code>    OrangeTheme(elevations: CustomElevationTokensProvider())
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>0.8.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init()/index.html"><code>init()</code></a><p>Initializes the provider.</p></li></ul></article></noscript><div id="app"></div></body></html>

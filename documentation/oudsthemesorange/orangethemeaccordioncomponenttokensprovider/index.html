<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OrangeThemeAccordionComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A class which wraps all component  tokens of accordions for accordions components. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllAccordionComponentTokensProvider` implementation inside `OUDSTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `OUDSTheme` implementation to use. Custom themes can use subclass of ``doc://OUDSThemesOrange/documentation/OUDSThemesOrange/OrangeThemeAccordionComponentTokensProvider`` and apply the provider they need. It implements also the protocol `AccordionComponentTokens` and `AccordionFaqComponentTokens` so as to expose the component tokens for accordions through any `OUDSTheme`. Accordions components tokens are defined with semantic tokens spaces (from `AllSpaceSemanticTokensProvider`) and sizes (from `AllSizeSemanticTokensProvider`)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme Orange</a></li><li>OrangeThemeAccordionComponentTokensProvider</li></ul><p>Class</p><h1>OrangeThemeAccordionComponentTokensProvider</h1><p>A class which wraps all <b>component  tokens of accordions</b> for <i>accordions</i> components. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllAccordionComponentTokensProvider</code> implementation inside <code>OUDSTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>OUDSTheme</code> implementation to use. Custom themes can use subclass of <a href="."><code>OrangeThemeAccordionComponentTokensProvider</code></a> and apply the provider they need. It implements also the protocol <code>AccordionComponentTokens</code> and <code>AccordionFaqComponentTokens</code> so as to expose the component tokens for <i>accordions</i> through any <code>OUDSTheme</code>. <i>Accordions</i> components tokens are defined with semantic tokens spaces (from <code>AllSpaceSemanticTokensProvider</code>) and sizes (from <code>AllSizeSemanticTokensProvider</code>).</p><pre><code>class OrangeThemeAccordionComponentTokensProvider</code></pre></section><h2>Overview</h2><pre class="swift"><code>    // Define your own provider for accordion component tokens
    // by inheriting from existing provider
    class CustomAccordionComponentTokensProvider: OrangeThemeAccordionComponentTokensProvider {

        // Then override the accordion component tokens you want.

        override var spacePaddingBlockBottomExpandContainerDefault: SpaceSemanticToken { DimensionRawTokens._100 }

        // ...
    }

    // Or define your own provider from scratch
    class CustomAccordionComponentTokensProvider: AllAccordionComponentTokens {

        // And implement hundreds of tokens.
        // You are allowed to give semantic tokens providers if you want to define values.
    }
</code></pre><p>Then, you can give this <code>CustomAccordionComponentTokensProvider</code> to your own theme implementation:</p><pre class="swift"><code>class LocalTheme: OrangeTheme {

    override init() {
        super.init(accordion: CustomAccordionComponentTokensProvider())
    }
}
</code></pre><p>or to an already existing theme for example:</p><pre class="swift"><code>    OrangeTheme(accordion: CustomAccordionComponentTokensProvider())
</code></pre><p>It is also possible to use your own semantic tokens providers for this component tokens providers:</p><pre class="swift"><code>    // Uses by default here:
    // - OrangeThemeSizeSemanticTokensProvider for sizes
    // - OrangeThemeSpaceSemanticTokensProvider for spaces
    let accordionComponentTokensProvider = OrangeThemeAccordionComponentTokensProvider()

    // Or use your own semantic tokens providers
    let accordionComponentTokensProvider = OrangeThemeAccordionComponentTokensProvider(
                    sizes: CustomSizeSemanticTokensProvider(),
                    spaces: CustomSpaceSemanticTokensProvider())
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(sizes:spaces:)/index.html"><code>init(sizes: (any AllSizeSemanticTokensProvider)?, spaces: (any AllSpaceSemanticTokensProvider)?)</code><p>Defines a provider of component tokens dedicated to accordions.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="sizes/index.html"><code>let sizes: any AllSizeSemanticTokensProvider</code><p>Provider of sizes semantic tokens to use for alert sizes</p></a></li><li><a href="spaces/index.html"><code>let spaces: any AllSpaceSemanticTokensProvider</code><p>Provider of spaces semantic tokens to use for alert spaces</p></a></li></ul></article></noscript><div id="app"></div></body></html>

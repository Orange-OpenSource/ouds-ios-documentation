<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OrangeThemeBulletListComponentTokensProvider</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="A class which wraps all component  tokens of bullet list for bullet list objects like `OUDSBulletList`. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a `AllBulletListComponentTokensProvider` implementation inside `OUDSTheme` so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an `OUDSTheme` implementation to use. Custom themes can use subclass of ``doc://OUDSThemesOrange/documentation/OUDSThemesOrange/OrangeThemeBulletListComponentTokensProvider`` and apply the provider they need. It implements also the protocol `BulletListComponentTokens` so as to expose the component tokens for bullet list through any `OUDSTheme`. Bullet list components tokens are defined with raw and semantic tokens of spaces (from `AllSpaceSemanticTokensProvider`)." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Theme Orange</a></li><li>OrangeThemeBulletListComponentTokensProvider</li></ul><p>Class</p><h1>OrangeThemeBulletListComponentTokensProvider</h1><p>A class which wraps all <b>component  tokens of bullet list</b> for <i>bullet list</i> objects like <code>OUDSBulletList</code>. Contains also references to semantic tokens providers so as to be able to use them to define the component tokens. This provider should be integrated as a <code>AllBulletListComponentTokensProvider</code> implementation inside <code>OUDSTheme</code> so as to provide all tokens to the users. It helps users to override some of the tokens and assign them to an <code>OUDSTheme</code> implementation to use. Custom themes can use subclass of <a href="."><code>OrangeThemeBulletListComponentTokensProvider</code></a> and apply the provider they need. It implements also the protocol <code>BulletListComponentTokens</code> so as to expose the component tokens for <i>bullet list</i> through any <code>OUDSTheme</code>. <i>Bullet list</i> components tokens are defined with raw and semantic tokens of spaces (from <code>AllSpaceSemanticTokensProvider</code>).</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>class OrangeThemeBulletListComponentTokensProvider</code></pre></section><h2>Overview</h2><pre class="swift"><code>    // Define your own provider for bullet list component tokens
    // by inheriting from existing provider
    class CustomBulletListComponentTokensProvider: OrangeThemeBulletListComponentTokensProvider {

        // Then override the bullet list component tokens you want.

        override var spacePaddingBlock: SpaceSemanticToken { spaces.paddingInlineSmall }

        // ...
    }

    // Or define your own provider from scratch
    class CustomBulletListComponentTokensProvider: BulletListComponentTokens {

        // And implement hunders of tokens.
        // You are allowed to give semantic tokens providers if you want to define values.
    }
</code></pre><p>Then, you can give this <code>CustomBulletListComponentTokensProvider</code> to your own theme implementation:</p><pre class="swift"><code>class LocalTheme: OrangeTheme {

    override init() {
        super.init(bulletList: CustomBulletListComponentTokensProvider())
    }
}
</code></pre><p>or to an already existing theme for example:</p><pre class="swift"><code>    OrangeTheme(bulletList: CustomBulletListComponentTokensProvider())
</code></pre><p>It is also possible to use your own semantic tokens providers for this component tokens providers:</p><pre class="swift"><code>    // Uses by default here:
    // - OrangeThemeSpaceSemanticTokensProvider for spaces
    let bulletListComponentTokensProvider = OrangeThemeBulletListComponentTokensProvider()

    // Or use your own size, color and space semantic tokens providers (or only some)
    let bulletListComponentTokensProvider = OrangeThemeBulletListComponentTokensProvider(
                                                spaces: CustomSpaceSemanticTokensProvider())
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>0.10.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(spaces:)/index.html"><code>init(spaces: AllSpaceSemanticTokensProvider?)</code></a><p>Defines a provider of component tokens dedicated to <code>OUDSLink</code></p></li></ul><h3>Instance Properties</h3><ul><li><a href="spaces/index.html"><code>let spaces: AllSpaceSemanticTokensProvider</code></a><p>Provider of spaces semantic tokens to use for link spaces</p></li></ul></article></noscript><div id="app"></div></body></html>

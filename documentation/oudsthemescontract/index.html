<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>Welcome to Orange Unified Design System</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="Orange Unified Design System: Build Sharper. Ship faster. Perform better." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li>Welcome to Orange Unified Design System</li></ul><p>Framework</p><h1>Welcome to Orange Unified Design System</h1><p>Orange Unified Design System: Build Sharper. Ship faster. Perform better.</p></section><h2>Overview</h2><pre><code>🧬 Core version: 1.12.0
</code></pre><p><i>Orange Unified Design System</i> is the new design system unified and cohesive across all platforms to build Orange mobile applications for everyone everywhere. Its objective is to propose a set of guidelines about how to apply the Orange brand on mobile applications. It also provides series of components and modules that show in details how to use this in the Orange apps.</p><p><i>Orange Unified Design System</i> has been implemented in two code repositories:</p><ul><li><p>a SwiftUI code library distributed as a Swift package for all Apple platforms (<a href="https://github.com/Orange-OpenSource/ouds-ios">Orange-OpenSource/ouds-ios</a>)</p></li><li><p>a demo application named <i>Design System Toolbox</i> that can be launched to show the guidelines, components, and modules (<a href="https://github.com/Orange-OpenSource/ouds-ios-design-system-toolbox">Orange-OpenSource/ouds-ios-design-system-toolbox</a>)</p></li></ul><p>This demo app also shows how to use the library and style existing components. Using these resources will help you create Orange-branded applications faster while benefiting from the work done to ensure that all examples meet the brand, ecodesign, open-source, and accessibility requirements.</p><p>You can find more details about this design system on the official website, <a href="https://unified-design-system.orange.com/">unified-design-system.orange.com</a>.</p><blockquote class="aside note"><p class="label">Note</p><p>Orange Unified Design System framework supports iOS / iPadOS 15 and later.</p></blockquote><blockquote class="aside important"><p class="label">Important</p><p>Orange Unified Design System framework focuses first on iOS / iPadOS, but other platforms like macOS, visionOS, watchOS and tvOS are supported.</p></blockquote><blockquote class="aside tip"><p class="label">Tip</p><p>Feel free to submit pull requests if you can improve the support of any platforms!</p></blockquote><h2>Data and privacy</h2><p>The Orange Unified Design System library is a Software Development Kit (SDK) that allows developers to create Orange-branded mobile applications. As such:</p><ul><li><p>this SDK does not handle any personal data</p></li><li><p>this SDK does not require any device permission to work</p></li></ul><h2>Topics</h2><h3>Essentials</h3><p></p><ul><li><a href="gettingstarted/index.html"><p>Getting Started with OUDS</p></a><p>How to add the package as dependency, import libraries and use theme and components for your apps.</p></li><li><a href="tokens/index.html"><p>Tokens</p></a><p>Design tokens represent the small, repeated design decisions that make up a design system’s visual style. Tokens wrap hard-coded static values, such as hexadecimal codes for color, with self-explanatory names. They are used to define the look and feel and the style of everything. They are exposed through the themes and can be used as they are.</p></li><li><a href="themes/index.html"><p>Themes</p></a><p><i>Themes</i> are applications of specific values for <i>components tokens</i> and <i>semantic tokens</i> using in the end <i>raw tokens</i>.(thus final usable low level values). A <i>theme</i> contains any relevant tokens which can be used for components rendering. A <i>theme</i> can use its own assets like fonts and icons.</p></li><li><a href="components/index.html"><p>Components</p></a><p><i>Components</i> are the <code>View</code> objects you can add in the views of your apps, like buttons, links, cards etc.</p></li><li><a href="modules/index.html"><p>Modules</p></a><p>A <i>module</i> can be seen as a set of features and components to fill a need.</p></li></ul><h3>Classes</h3><ul><li><a href="oudstheme/index.html"><code>class OUDSTheme</code></a><p>This is the base theme that all themes must inherit from. A Swift <code>class</code> has been used so as to allow to easily override some attributes and have inheritance, without having for developers to implement all tokens. Any properties of an overridable theme should be defined so as to provide defaults values. We allow this theme to be derivated and be overridden. <a href="oudstheme/index.html"><code>OUDSTheme</code></a> can be seen as a kind of “abstract class” in <i>object oriented paradigm</i>, or <i>theme contract</i>. Because <code>OUDSTheme</code> is not a <i>final</i> class, its type cannot be seen as <code>Sendable</code>, that is the reason why this conformity is unchecked.</p></li></ul><h3>Protocols</h3><ul><li><a href="allaccordioncomponenttokensprovider/index.html"><code>protocol AllAccordionComponentTokensProvider</code></a><p>Something which provides all component tokens of accions</p></li><li><a href="allalertcomponenttokensprovider/index.html"><code>protocol AllAlertComponentTokensProvider</code></a><p>Something which provides all component tokens of alert</p></li><li><a href="allalertmessagecomponenttokensprovider/index.html"><code>protocol AllAlertMessageComponentTokensProvider</code></a><p>Something which provides all component tokens of alert messages</p></li><li><a href="allbadgecomponenttokensprovider/index.html"><code>protocol AllBadgeComponentTokensProvider</code></a><p>Something which provides all component tokens of badge</p></li><li><a href="allbarcomponenttokensprovider/index.html"><code>protocol AllBarComponentTokensProvider</code></a><p>Something which provides all component tokens of bars</p></li><li><a href="allbordersemantictokensprovider/index.html"><code>protocol AllBorderSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of border</p></li><li><a href="allbulletlistcomponenttokensprovider/index.html"><code>protocol AllBulletListComponentTokensProvider</code></a><p>Something which provides all component tokens of bullet list</p></li><li><a href="allbuttoncomponenttokensprovider/index.html"><code>protocol AllButtonComponentTokensProvider</code></a><p>Something which provides all component tokens of button</p></li><li><a href="allcardcomponenttokensprovider/index.html"><code>protocol AllCardComponentTokensProvider</code></a><p>Something which provides all component tokens of card</p></li><li><a href="allcategoricaltagcomponenttokensprovider/index.html"><code>protocol AllCategoricalTagComponentTokensProvider</code></a><p>Something which provides all component tokens for categorical tag</p></li><li><a href="allcheckboxcomponenttokensprovider/index.html"><code>protocol AllCheckboxComponentTokensProvider</code></a><p>Something which provides all component tokens of checkboxes</p></li><li><a href="allchipcomponenttokensprovider/index.html"><code>protocol AllChipComponentTokensProvider</code></a><p>Something which provides all component tokens of chip</p></li><li><a href="allcolorchartsemantictokensprovider/index.html"><code>protocol AllColorChartSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of colors charts</p></li><li><a href="allcolordecorativesemantictokensprovider/index.html"><code>protocol AllColorDecorativeSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of colors charts</p></li><li><a href="allcolormodesemantictokensprovider/index.html"><code>protocol AllColorModeSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of colors modes</p></li><li><a href="allcolorsemantictokensprovider/index.html"><code>protocol AllColorSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of colors</p></li><li><a href="allcontainedtabscomponenttokensprovider/index.html"><code>protocol AllContainedTabsComponentTokensProvider</code></a><p>Something which provides all component tokens of contained tabs</p></li><li><a href="alldimensionsemantictokensprovider/index.html"><code>protocol AllDimensionSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of _</p></li><li><a href="alldividercomponenttokensprovider/index.html"><code>protocol AllDividerComponentTokensProvider</code></a><p>Something which provides all component tokens of divider</p></li><li><a href="alleffectsemantictokensprovider/index.html"><code>protocol AllEffectSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of effects</p></li><li><a href="allelevationsemantictokensprovider/index.html"><code>protocol AllElevationSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of elevation</p></li><li><a href="allfontsemantictokensprovider/index.html"><code>protocol AllFontSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of font</p></li><li><a href="allgridsemantictokensprovider/index.html"><code>protocol AllGridSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of grid</p></li><li><a href="alliconcomponenttokensprovider/index.html"><code>protocol AllIconComponentTokensProvider</code></a><p>Something which provides all components tokens for icons</p></li><li><a href="allinputtagcomponenttokensprovider/index.html"><code>protocol AllInputTagComponentTokensProvider</code></a><p>Something which provides all component tokens of input tag</p></li><li><a href="alllinetabscomponenttokensprovider/index.html"><code>protocol AllLineTabsComponentTokensProvider</code></a><p>Something which provides all component tokens of line tabs</p></li><li><a href="alllinkcomponenttokensprovider/index.html"><code>protocol AllLinkComponentTokensProvider</code></a><p>Something which provides all component tokens of link</p></li><li><a href="alllistitemcomponenttokensprovider/index.html"><code>protocol AllListItemComponentTokensProvider</code></a><p>Something which provides all component tokens of list item</p></li><li><a href="allopacitysemantictokensprovider/index.html"><code>protocol AllOpacitySemanticTokensProvider</code></a><p>Something which provides all semantic tokens of opacity</p></li><li><a href="allpincodeinputcomponenttokensprovider/index.html"><code>protocol AllPinCodeInputComponentTokensProvider</code></a><p>Something which provides all component tokens of pin code input</p></li><li><a href="allprogressindicatorcomponenttokensprovider/index.html"><code>protocol AllProgressIndicatorComponentTokensProvider</code></a><p>Something which provides all component tokens of progress indicator</p></li><li><a href="allquantityinputcomponenttokensprovider/index.html"><code>protocol AllQuantityInputComponentTokensProvider</code></a><p>Something which provides all component tokens of quantity input</p></li><li><a href="allradiobuttoncomponenttokensprovider/index.html"><code>protocol AllRadioButtonComponentTokensProvider</code></a><p>Something which provides all component tokens of radio buttons</p></li><li><a href="allselectinputcomponenttokensprovider/index.html"><code>protocol AllSelectInputComponentTokensProvider</code></a><p>Something which provides all component tokens of select input</p></li><li><a href="allsizesemantictokensprovider/index.html"><code>protocol AllSizeSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of size</p></li><li><a href="allskeletoncomponenttokensprovider/index.html"><code>protocol AllSkeletonComponentTokensProvider</code></a><p>Something which provides all component tokens of skeleton</p></li><li><a href="allspacesemantictokensprovider/index.html"><code>protocol AllSpaceSemanticTokensProvider</code></a><p>Something which provides all semantic tokens of space</p></li><li><a href="allswitchcomponenttokensprovider/index.html"><code>protocol AllSwitchComponentTokensProvider</code></a><p>Something which provides all component tokens of switch / toggle</p></li><li><a href="alltagcomponenttokensprovider/index.html"><code>protocol AllTagComponentTokensProvider</code></a><p>Something which provides all component tokens of tag</p></li><li><a href="alltextareacomponenttokensprovider/index.html"><code>protocol AllTextAreaComponentTokensProvider</code></a><p>Something which provides all component tokens of text area</p></li><li><a href="alltextinputcomponenttokensprovider/index.html"><code>protocol AllTextInputComponentTokensProvider</code></a><p>Something which provides all component tokens of text input</p></li><li><a href="alltoastcomponenttokensprovider/index.html"><code>protocol AllToastComponentTokensProvider</code></a><p>Something which provides all component tokens of toast</p></li><li><a href="alltypographycomponenttokensprovider/index.html"><code>protocol AllTypographyComponentTokensProvider</code></a><p>Something which provides all component tokens of typography</p></li><li><a href="tokensprovider/index.html"><code>protocol TokensProvider</code></a><p>Protocol to add to any semantic or component tokens provider so as to be gather with all providers and given to the theme for initialization</p></li></ul><h3>Structures</h3><ul><li><a href="oudsthemetuning/index.html"><code>struct OUDSThemeTuning</code></a><p>To ease flexibility of themes and enhance their adoption some parts of the theme can be tuned. This allows for example to have a theme defined by the Brand but to apply some customization.</p></li><li><a href="oudsthemeableview/index.html"><code>struct OUDSThemeableView</code></a><p>This is a kind of root <code>SwiftUI.View</code> to add at the top level of your views tree so as to define as an environment variable the theme which will be applied. Any theme to apply must be a child of <code>OUDSTheme</code>, direct or not.</p></li></ul><h3>Type Aliases</h3><ul><li><a href="tuning/index.html"><code>typealias Tuning</code></a><p>Type alias to keep things simple and short</p></li></ul><h3>Enumerations</h3><ul><li><a href="oudsversions/index.html"><code>enum OUDSVersions</code></a><p>Gathers the components and themes versions exposed through Tokenator based on Figma tokens</p></li></ul><h3>Extended Modules</h3><ul><li><a href="swiftuicore/index.html"><code></code></a></li></ul></article></noscript><div id="app"></div></body></html>

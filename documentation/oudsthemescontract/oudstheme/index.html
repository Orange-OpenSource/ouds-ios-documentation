>final</i> class, its type cannot be seen as <code>Sendable</code>, that is the reason why this conformity is unchecked.</p><pre><code>class OUDSTheme</code></pre></section><h2>Overview</h2><p><b>Warning: You are not supposed to use this abstract default theme directly. Please prefer <code>OrangeTheme</code> instead</b> Prefer theme like <code>OrangeTheme</code>.</p><p>Any theme is handled as <a href="."><code>OUDSTheme</code></a>. It contains plenty of <i>tokens provider</i> for semantic tokens and component tokens. Theme can have also non-provider properties like <i>font family</i> to apply.</p><blockquote class="aside since"><p class="label">Since</p><p>0.8.0</p></blockquote><h2>Topics</h2><h3>Operators</h3><ul><li><a href="==(_:_:)/index.html"><code>static func == (OUDSTheme, OUDSTheme) -&gt; Bool</code></a><p>Themes are considered equals if they have the same name and same tuning identifier</p></li></ul><h3>Initializers</h3><ul><li><a href="init(borders:colors:colormodes:colorscharts:colorsdecorative:effects:elevations:fonts:grids:opacities:dimensions:sizes:spaces:accordion:alert:alertmessage:badge:bar:bulletlist:button:card:categoricaltag:checkbox:chip:containedtabs:divider:icon:linetabs:link:listitem:pincodeinput:progressindicator:quantityinput:radiobutton:selectinput:skeleton:switch:tag:inputtag:textarea:textinput:toast:typography:resourcesbundle:name:fontfamily:tuning:)/index.html"><code>init(borders: AllBorderSemanticTokensProvider, colors: AllColorSemanticTokensProvider, colorModes: AllColorModeSemanticTokensProvider, colorsCharts: AllColorChartSemanticTokensProvider?, colorsDecorative: AllColorDecorativeSemanticTokensProvider?, effects: AllEffectSemanticTokensProvider, elevations: AllElevationSemanticTokensProvider, fonts: AllFontSemanticTokensProvider, grids: AllGridSemanticTokensProvider, opacities: AllOpacitySemanticTokensProvider, dimensions: AllDimensionSemanticTokensProvider, sizes: AllSizeSemanticTokensProvider, spaces: AllSpaceSemanticTokensProvi

<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>init(label:description:overline:extraLabel:helperText:textSlot:bottomSlot:)</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="Creates a new list item data model with a label and optional textual fields." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">OUDSListItemData</a></li><li>init(label:description:overline:extraLabel:helperText:textSlot:bottomSlot:)</li></ul><p>Initializer</p><h1>init(label:description:overline:extraLabel:helperText:textSlot:bottomSlot:)</h1><p>Creates a new list item data model with a label and optional textual fields.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>init(label: Label, description: OUDSTextualContent? = nil, overline: OUDSTextualContent? = nil, extraLabel: OUDSTextualContent? = nil, helperText: OUDSTextualContent? = nil, textSlot: Slot? = nil, bottomSlot: Slot? = nil)</code></pre></section><h2>Parameters</h2><dl><dt>label</dt><dd><p>The primary content of the list item (plain text, rich text or custom view).</p></dd><dt>description</dt><dd><p>An optional secondary text displayed below the label. Defaults to <code>nil</code>.</p></dd><dt>overline</dt><dd><p>An optional text displayed above the label. Defaults to <code>nil</code>. <b>Ignored when the list item size is <code>.small</code>.</b></p></dd><dt>extraLabel</dt><dd><p>An optional additional text displayed below the description. Defaults to <code>nil</code>. <b>Ignored when the list item size is <code>.small</code>.</b></p></dd><dt>helperText</dt><dd><p>An optional supporting text displayed below the list item row. Defaults to <code>nil</code>.</p></dd><dt>textSlot</dt><dd><p>An optional custom view displayed under the texts but before the helper text. Defaults to <code>nil</code>.</p></dd><dt>bottomSlot</dt><dd><p>An optional custom view displayed under the main content and before the helper text. Defaults to <code>nil</code>.</p></dd></dl><h2>Discussion</h2><p>Every optional textual field (<code>description</code>, <code>overline</code>, <code>extraLabel</code>, <code>helperText</code>) accepts either a plain <code>String</code> or a styled <code>AttributedString</code> through <a href="../../oudstextualcontent/index.html"><code>OUDSTextualContent</code></a>. A plain string literal is automatically converted to <a href="../../oudstextualcontent/raw(_:)/index.html"><code>OUDSTextualContent.raw(_:)</code></a> thanks to <code>ExpressibleByStringLiteral</code>.</p><p>When the label is a bare string literal and no textual field is given (or only <code>textSlot</code> / <code>bottomSlot</code>), prefer <code>label: .textual("…")</code> so the compiler selects this initializer without any deprecation warning.</p><blockquote class="aside since"><p class="label">Since</p><p>3.2.0</p></blockquote></article></noscript><div id="app"></div></body></html>

ist item with small size (via <a href="../../swiftuicore/view/oudslistitemsize(_:)/index.html"><code>oudsListItemSize(_:)</code></a>), where the smallest size is always applied.</p></dd><dt>badgeType</dt><dd><p>The type of an optional badge displayed at the bottom-trailing corner of the avatar.  Defaults to <code>nil</code>.</p></dd></dl><h2>Discussion</h2><pre class="swift"><code>    // Simple avatar with icon

</code></pre></article></noscript><div id="app"></div></body></html>

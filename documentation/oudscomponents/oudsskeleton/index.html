<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OUDSSkeleton</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A skeleton is a UI element that indicates when content is loading. The skeleton enhances user experience by temporarily replacing content with gray areas or animations that simulate the visual structure of the forthcoming content." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>OUDSSkeleton</li></ul><p>Structure</p><h1>OUDSSkeleton</h1><p>A skeleton is a UI element that indicates when content is loading. The skeleton enhances user experience by temporarily replacing content with gray areas or animations that simulate the visual structure of the forthcoming content.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct OUDSSkeleton&lt;Shape&gt; where Shape : Shape</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../indicators/index.html">Indicators</a></li></ul><h2>Overview</h2><p>The animation is automatically disabled if the low power mode or the accessibility reduce motion are activated.</p><p>The <code>security margin</code> includes or not transparent vertical padding (with 0% opacity) at the top and bottom of the skeleton component. This padding prevents the creation of excessively large uniform surfaces, maintaining a visually balanced and structured layout.</p><h2>Code samples</h2><p>Use plain object <a href="."><code>OUDSSkeleton</code></a> to draw a skeleton:</p><pre class="swift"><code>    HStack {
        OUDSSkeleton(securityMargin: true).frame(width: 180, height: 48)

        OUDSSkeleton(securityMargin: true).frame(width: 300, height: 150)
    }
</code></pre><p>Apply a skeleton effect to enable on a <code>View</code>:</p><pre class="swift"><code>    Button {

    } label: {
        VStack {
            Text("Title")
            Label("Subtitle", systemImage: "phone")
        }
    }
    .skeleton()
</code></pre><p>Enable the skeleton mode on a view hierarchy:</p><pre class="swift"><code>    SomeView()
        .showSkeleton(isVisible: true)

</code></pre><h2>Accessibility considerations</h2><p>If the skeletons are used to draw a page in loading state, it is important to use Voice Over to make an announcement to vocalize the loading state of the page. In this case there is no need to vocalise the skeletons one by one.</p><p>If the skeleton is used for one object in a screen, an accessibility label should be added to the component in order to make Voice Over able to focus and vocalize the loading state of the component.</p><h2>Design documentation</h2><p><a href="https://r.orange.fr/r/S-ouds-doc-skeleton">unified-design-system.orange.com</a></p><h2>Themes rendering</h2><h3>Orange</h3><p><picture><img alt="A skeleton component in light and dark modes with Orange theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/indicators/skeleton/component_skeleton_orange.png"/></picture></p><h3>Orange Compact</h3><p><picture><img alt="A skeleton component in light and dark modes with Orange Compact theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/indicators/skeleton/component_skeleton_orangecompact.png"/></picture></p><h3>Sosh</h3><p><picture><img alt="A skeleton component in light and dark modes with Sosh theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/indicators/skeleton/component_skeleton_sosh.png"/></picture></p><h3>Wireframe</h3><p><picture><img alt="A skeleton component in light and dark modes with Wireframe theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/indicators/skeleton/component_skeleton_wireframe.png"/></picture></p><blockquote class="aside version"><p class="label">Version</p><p>1.0.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>3.2.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(securitymargin:cornerradius:)/index.html"><code>init(securityMargin: Bool, cornerRadius: CGFloat)</code><p>Create a skeleton  with the default <code>RoundedRectangle</code> shape according to the <code>cornerRadius</code></p></a></li><li><a href="init(securitymargin:shape:)/index.html"><code>init(securityMargin: Bool, shape: Shape)</code><p>Create a skeleton  with the default <code>Rectangle</code> shape.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>

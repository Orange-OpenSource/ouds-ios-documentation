<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OUDSListItemIcon</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="An icon element that can be used at the leading or trailing position of a list item such as ``doc://OUDSComponents/documentation/OUDSComponents/OUDSStaticListItem`` or ``doc://OUDSComponents/documentation/OUDSComponents/OUDSNavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>OUDSListItemIcon</li></ul><p>Structure</p><h1>OUDSListItemIcon</h1><p>An icon element that can be used at the leading or trailing position of a list item such as <a href="../oudsstaticlistitem/index.html"><code>OUDSStaticListItem</code></a> or <a href="../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct OUDSListItemIcon</code></pre></section><h2>Overview</h2><p><a href="."><code>OUDSListItemIcon</code></a> displays a status icon (info, warning, positive, negative) with a predefined asset, or a custom neutral icon from a provided image. Each icon type has a semantic color applied automatically based on the current theme.</p><p>An optional notification badge can be attached to neutral icons to indicate additional status.</p><h2>Status</h2><p>The <a href="iconstatus/index.html"><code>OUDSListItemIcon.IconStatus</code></a> enum defines the available icon variants:</p><ul><li><p><b><code>.neutral(asset:badge:)</code></b>: A custom icon from a provided <code>Image</code> asset, rendered with the default content color. An optional notification badge (small dot) can be displayed at the top-trailing corner.</p></li><li><p><b><code>.positive</code></b>: A predefined checkmark/confirmation icon with a positive (green) semantic color.</p></li><li><p><b><code>.info</code></b>: A predefined information icon with an informational (blue) semantic color.</p></li><li><p><b><code>.warning</code></b>: A predefined warning icon with a warning (yellow/orange) semantic color. This icon uses a two-layer rendering with distinct internal and external shape colors.</p></li><li><p><b><code>.negative</code></b>: A predefined alert/important icon with a negative (red) semantic color.</p></li></ul><h2>Sizes</h2><p>The <a href="size/index.html"><code>OUDSListItemIcon.Size</code></a> enum defines the available sizes:</p><ul><li><p><b><code>.medium</code></b>: The default size, corresponding to the theme’s <code>controlItem.sizeAssetMedium</code> token.</p></li><li><p><b><code>.large</code></b>: The largest size, corresponding to the theme’s <code>controlItem.sizeAssetLarge</code> token.</p></li></ul><p><b>Note:</b> When the icon is embedded in a list item with small size (via <code>SwiftUI/View/oudsListItemSize(_:)</code>), the icon is always rendered at its smallest size regardless of the <code>size</code> parameter.</p><h2>Code samples</h2><pre class="swift"><code>    // Info icon with medium size (default)
    OUDSListItemIcon(status: .info, description: "Something new")

    // Warning icon with large size
    OUDSListItemIcon(status: .warning, description: "Mobile data almost used", size: .large)

    // Negative icon with medium size
    OUDSListItemIcon(status: .negative, description: "Payment failed", size: .medium)

    // Custom neutral icon without badge
    OUDSListItemIcon(status: .neutral(asset: Image(decorative: "ic_heart"), descritpion: "Emails"))

    // Custom neutral icon with notification badge
    OUDSListItemIcon(status: .neutral(asset: Image(decorative: "ic_heart"), description: "New emails received", badge: true))

    // Usage as leading element in a list item
    OUDSStaticListItem(
        data: OUDSListItemData(label: "Information"),
        leading: .icon(OUDSListItemIcon(status: .info, description: "", size: .medium))
    )

    // Usage as trailing element in a list item
    OUDSStaticListItem(
        data: OUDSListItemData(label: "Warning"),
        trailing: .icon(OUDSListItemIcon(status: .warning, description: "", size: .medium))
    )
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(status:description:size:)/index.html"><code>init(status: OUDSListItemIcon.IconStatus, description: String, size: OUDSListItemIcon.Size)</code><p>Creates an icon element for use in a list item at the leading or trailing position.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Enumerations</h3><ul><li><a href="iconstatus/index.html"><code>enum IconStatus</code><p>Defines the type of icon to display. Each type determines the icon asset and its semantic foreground color.</p></a></li><li><a href="size/index.html"><code>enum Size</code><p>Defines the available sizes for the icon. When the icon is embedded in a list item with <code>.small</code> size, this parameter is ignored and a smallest size is always used.</p></a></li></ul></article></noscript><div id="app"></div></body></html>

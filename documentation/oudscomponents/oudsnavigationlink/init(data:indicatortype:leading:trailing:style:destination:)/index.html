<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>init(data:indicatorType:leading:trailing:style:destination:)</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="Defines an ``doc://OUDSComponents/documentation/OUDSComponents/OUDSNavigationListItem`` backed by a `NavigationLink` with a `Destination` ``doc://OUDSComponents/documentation/OUDSComponents/SwiftUICore/View``  to display when the user taps, with the same content options as ``doc://OUDSComponents/documentation/OUDSComponents/OUDSNavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">OUDSNavigationLink</a></li><li>init(data:indicatorType:leading:trailing:style:destination:)</li></ul><p>Initializer</p><h1>init(data:indicatorType:leading:trailing:style:destination:)</h1><p>Defines an <a href="../../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a> backed by a <code>NavigationLink</code> with a <code>Destination</code> <a href="../../swiftuicore/view/index.html"><code>View</code></a>  to display when the user taps, with the same content options as <a href="../../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li></ul><pre><code>@MainActor init(data: OUDSListItemData, indicatorType: OUDSNavigationListItemIndicatorType = .next, leading: OUDSListItemLeading? = nil, trailing: OUDSListItemTrailing? = nil, style: OUDSListItemContentStyle = .item(divider: true, background: false), destination: @escaping () -&gt; Destination)</code></pre></section><h2>Parameters</h2><dl><dt>data</dt><dd><p>The data of the item, including label, description, overline, extra label, slots and helper text.</p></dd><dt>indicatorType</dt><dd><p>The type of link to apply, default set to <code>.next</code></p></dd><dt>leading</dt><dd><p>An optional element displayed at the leading position (before the texts). <b>Note:</b> Ignored when <code>indicatorType</code> is <code>.previous</code>.</p></dd><dt>trailing</dt><dd><p>An optional element displayed at the trailing position (after the texts).</p></dd><dt>style</dt><dd><p>The type of style to apply, default set to <code>.item(divider: true, background: false)</code></p></dd><dt>destination</dt><dd><p>A closure providing the view to display when the user taps the item.</p></dd></dl><h2>Discussion</h2><p>The label of <code>data</code> is used as navigation title of the destination.</p><blockquote class="aside since"><p class="label">Since</p><p>3.3.0</p></blockquote></article></noscript><div id="app"></div></body></html>

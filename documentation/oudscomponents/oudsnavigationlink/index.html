<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OUDSNavigationLink</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="Uses an ``doc://OUDSComponents/documentation/OUDSComponents/OUDSNavigationListItem``  object backed by a `NavigationLink` so as to use easily the navigation list item from OUDS inside the navigation of the app." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>OUDSNavigationLink</li></ul><p>Structure</p><h1>OUDSNavigationLink</h1><p>Uses an <a href="../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a>  object backed by a <code>NavigationLink</code> so as to use easily the navigation list item from OUDS inside the navigation of the app.</p><ul id="availability"><li>iOS 15.0+</li></ul><pre><code>@MainActor struct OUDSNavigationLink&lt;Destination&gt; where Destination : View</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../navigations/index.html">Navigations</a></li></ul><h2>Code samples</h2><pre class="swift"><code>    // The label of data will be used both for OUDSNavigationListItem label and navigation title
    OUDSNavigationLink(data: OUDSListItemData(label: .textual("Title of my destination view"))) {
        // The view to display when the user taps on the item
        MyDestinationView()
    }

    // Same content options as OUDSNavigationListItem: data, leading and trailing
    OUDSNavigationLink(
        data: OUDSListItemData(label: "Profile", description: "View your profile"),
        leading: .avatar(OUDSListItemAvatar(type: .icon, size: .medium)),
        trailing: .text(.labelMuted("Details"))
    ) {
        MyProfileView()
    }
</code></pre><p>The initializers taking a <code>title</code> or a <code>LocalizedStringKey</code> are deprecated since 3.3.0, see <code>MIGRATION.md</code> section <code>v3.2.0 → v3.3.0</code>.</p><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(_:tablename:bundle:hasboldlabel:indicatortype:style:destination:)/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, hasBoldLabel: Bool, indicatorType: OUDSNavigationListItemIndicatorType, style: OUDSListItemContentStyle, destination: () -&gt; Destination)</code></a><p>Defines an <a href="../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a> backed by a <code>NavigationLink</code> with a <code>Destination</code> <a href="../swiftuicore/view/index.html"><code>View</code></a>  to display whe the user taps.</p></li><li><a href="init(data:indicatortype:leading:trailing:style:destination:)/index.html"><code>init(data: OUDSListItemData, indicatorType: OUDSNavigationListItemIndicatorType, leading: OUDSListItemLeading?, trailing: OUDSListItemTrailing?, style: OUDSListItemContentStyle, destination: () -&gt; Destination)</code></a><p>Defines an <a href="../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a> backed by a <code>NavigationLink</code> with a <code>Destination</code> <a href="../swiftuicore/view/index.html"><code>View</code></a>  to display when the user taps, with the same content options as <a href="../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a>.</p></li><li><a href="init(title:hasboldlabel:indicatortype:style:destination:)/index.html"><code>init(title: String, hasBoldLabel: Bool, indicatorType: OUDSNavigationListItemIndicatorType, style: OUDSListItemContentStyle, destination: () -&gt; Destination)</code></a><p>Defines an <a href="../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a> backed by a <code>NavigationLink</code> with a <code>Destination</code> <a href="../swiftuicore/view/index.html"><code>View</code></a>  to display when the user taps.</p></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>

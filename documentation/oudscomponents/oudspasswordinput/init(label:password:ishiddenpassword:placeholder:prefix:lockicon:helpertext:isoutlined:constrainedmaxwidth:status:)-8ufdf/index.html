<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>init(label:password:isHiddenPassword:placeholder:prefix:lockIcon:helperText:isOutlined:constrainedMaxWidth:status:)</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="Creates a password input." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">OUDSPasswordInput</a></li><li>init(label:password:isHiddenPassword:placeholder:prefix:lockIcon:helperText:isOutlined:constrainedMaxWidth:status:)</li></ul><p>Initializer</p><h1>init(label:password:isHiddenPassword:placeholder:prefix:lockIcon:helperText:isOutlined:constrainedMaxWidth:status:)</h1><p>Creates a password input.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>visionOS 1.0+</li></ul><pre><code>@MainActor init(label: String, password: Binding&lt;String&gt;, isHiddenPassword: Binding&lt;Bool&gt; = .constant(true), placeholder: String? = nil, prefix: String? = nil, lockIcon: Bool = false, helperText: OUDSTextualContent? = nil, isOutlined: Bool = false, constrainedMaxWidth: Bool = false, status: OUDSTextInput.Status = .enabled)</code></pre></section><h2>Parameters</h2><dl><dt>label</dt><dd><p>The label displayed above the password input.</p></dd><dt>password</dt><dd><p>The pasword to display and edit</p></dd><dt>isHiddenPassword</dt><dd><p>Flag to hide or show the password, By default set to <code>true</code>. Be carefull it is recommanded to hide password by default and let user to display it with the button.</p></dd><dt>placeholder</dt><dd><p>The text displayed when the password input is empty, by default is <i>nil</i></p></dd><dt>prefix</dt><dd><p>Text placed before the user’s input. A prefix is not common and is discouraged in a Password Input component. In very specific cases, it can provide context or format requirements (e.g., “DEV-” for test accounts, “admin-” as a pattern to define an admin password)</p></dd><dt>lockIcon</dt><dd><p>When <code>true</code>, a lock icon is displayed at the start of the password input to visually reinforce the security context. Defaults to <code>false</code>.</p></dd><dt>helperText</dt><dd><p>An optional helper text displayed below the password input, raw, localized or rich text. It conveys additional, information about the input field, such as how it will be used, by default is <i>nil</i>. If <code>status</code> is set to an error status, this <code>helperText</code> is ignored.</p></dd><dt>isOutlined</dt><dd><p>Controls the style of the pasword input. When <code>true</code>, it displays a minimalist password input with a transparent background and a visible stroke outlining the field, by default is <i>false</i></p></dd><dt>constrainedMaxWidth</dt><dd><p>When <code>true</code>, the width is constrained to a maximum value defined by the design system. When <code>false</code>, no specific width constraint is applied, allowing the component to size itself or follow external modifier. Defaults to <code>false</code>.</p></dd><dt>status</dt><dd><p>The current status of the password input base on <code>OUDSTextInput.Status</code>, by default to set <i>enabled</i></p></dd></dl><h2>Discussion</h2><p>The <code>helperText</code> is an <a href="../../oudstextualcontent/index.html"><code>OUDSTextualContent</code></a>: a raw <code>String</code>, a localized string or a rich <code>AttributedString</code>.</p><pre class="swift"><code>    OUDSPasswordInput(label: "Password", password: $password)

    OUDSPasswordInput(label: "Password",
                      password: $password,
                      helperText: .rich(AttributedString(markdown: "You should use a **strong password**")))  // Manage in your side errors for init
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.2.0</p></blockquote></article></noscript><div id="app"></div></body></html>

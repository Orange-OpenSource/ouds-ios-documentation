</code></pre><blockquote class="aside since"><p class="label">Since</p><p>1.4.0</p></blockquote><h2>Topics</h2><h3>Operators</h3><ul><li><a href="==(_:_:)/index.html"><code>static func == (`Self`, `Self`) -&gt; Bool</code></a></li></ul><h3>Enumeration Cases</h3><ul><li><a href="disabled/index.html"><code>case disabled</code></a><p>In <code>disabled</code> status, the field is non-interactive and grayed out to indicate it cannot be changed. Note the SwiftUI <code>View.disabled()</code> is ignored.</p></li><li><a href="enabled/index.html"><code>case enabled</code></a><p>The <code>enabled</code> status (default)</p></li><li><a href="error(message:)/index.html"><code>case error(message: String)</code></a><p>The <code>error</code> status indicates that the user input does not meet validation rules or expected formatting. It provides immediate visual feedback, typically through a red border, an error icon, and a clear, accessible error <code>message</code> positioned below the text area.</p></li><li><a href="loading(progress:)/index.html"><code>case loading(progress: Double?)</code></a><p>The <code>loading</code> state indicates that the system is processing or retrieving data related to the text entered. A circular progress indicator appears to inform the user that an action is in progress. The field remains editable while loading.</p></li><li><a href="readonly/index.html"><code>case readOnly</code></a><p>The <code>readOnly</code> status lets the text visible but not editable</p></li><li><a href="richerror(message:)/index.html"><code>case richError(message: AttributedString)</code></a><p>The <code>error</code> status indicates that the user input does not meet validation rules or expected formatting. It provides immediate visual feedback, typically through a red border, an error icon, and a clear, accessible error <code>message</code> positioned below the text area. The error message can be rich text.</p></li><li><a href="textualerror(message:)/index.html"><code>case textualError(message: OUDSTextualContent)</code></a><p>The <code>error</code> status indicates that the user input does not meet validation rules or expected formatting. It provides immediate visual feedback, typically through a red border, an error icon, and a clear, accessible error <code>message</code> positioned below the text area. The error message is an <a href="../../oudstextualcontent/index.html"><code>OUDSTextualContent</code></a>: raw, localized or rich text.</p></li></ul></article></noscript><div id="app"></div></body></html>

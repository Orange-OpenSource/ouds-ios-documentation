<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OUDSCategoricalTag</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="A `OUDSCategoricalTag` is a non-interactive label used to visually distinguish non-functional categories using categorical colours. It can represent information such as promotions, events, benefits or other locally defined categories. It does not communicate functional status or system feedback. Use the `OUDSTag` for success, warning, error, availability or other functional states. Use `OUDSCategoricalTag` tag only when its colour categories are defined by the product or local market guidelines." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>OUDSCategoricalTag</li></ul><p>Structure</p><h1>OUDSCategoricalTag</h1><p>A <code>OUDSCategoricalTag</code> is a non-interactive label used to visually distinguish non-functional categories using categorical colours. It can represent information such as promotions, events, benefits or other locally defined categories. It does not communicate functional status or system feedback. Use the <code>OUDSTag</code> for success, warning, error, availability or other functional states. Use <code>OUDSCategoricalTag</code> tag only when its colour categories are defined by the product or local market guidelines.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct OUDSCategoricalTag</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../indicators/index.html">Indicators</a></li></ul><h2>Overview</h2><p>Colors to use for categories are defined in <code>categorical tag</code> component tokens. The <code>OUDSCategoricalTag</code> is today defined for Orange, Orange Compact and Wireframe themes, <b>but not for Sosh</b>.</p><h2>Category</h2><p>Categorical tags have five categories, each with its own background color.</p><p><b>Only the Orange, Orange Compact, and Wireframe themes have such colors defined. Not Sosh.</b></p><h2>Shape</h2><p>Tags can have two shapes:</p><ul><li><p><b>Rounded</b>: A tag with fully rounded corners, creating a pill-shaped appearance.</p></li><li><p><b>Square</b>: A tag with sharp, square corners.</p></li></ul><h2>Size</h2><p>Tags can have two sizes:</p><ul><li><p><b>Default</b>: The standard tag size, suitable for most use cases.</p></li><li><p><b>Small</b>: A compact tag with reduced height and font size.</p></li></ul><h2>Layout</h2><p>There are three available layouts:</p><ul><li><p><b>Text only</b>: A tag that displays only text.</p></li><li><p><b>Text + Bullet</b>: A tag with a small indicator (dot) alongside the text.</p></li><li><p><b>Text + Icon</b>: A tag that includes an icon before the text.</p></li></ul><h2>Code samples</h2><pre class="swift"><code>    // Text only with category 1, rounded shape, default size
    OUDSCategoricalTag(label: "Label", category: .category1)

    // Text with category 2 and bullet
    OUDSCategoricalTag(label: "Label", category: .category2, leading: .bullet)

    // Text with category 3 and custom icon
    OUDSCategoricalTag(label: "Label", category: .category3, leading: .icon(OUDSImage(asset: Image(decorative: "ic_heart"))))

    // Small size, square shape
    OUDSCategoricalTag(label: "Label", category: .category4, shape: .square, size: .small)
</code></pre><h2>Design documentation</h2><p><a href="https://r.orange.fr/r/S-ouds-doc-categorical-tag">unified-design-system.orange.com</a></p><h2>Themes rendering</h2><h3>Orange</h3><p><picture><img alt="A categorical tag component in light and dark modes with Orange theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/indicators/tags/categoricaltag/component_categoricaltag_orange.png"/></picture></p><h3>Orange Compact</h3><p><picture><img alt="A categorical tag component in light and dark modes with Orange Compact theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/indicators/tags/categoricaltag/component_categoricaltag_orangecompact.png"/></picture></p><h3>Wireframe</h3><p><picture><img alt="A categorical tag component in light and dark modes with Wireframe theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/indicators/tags/categoricaltag/component_categoricaltag_wireframe.png"/></picture></p><blockquote class="aside version"><p class="label">Version</p><p>1.0.0</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>3.2.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(_:tablename:bundle:category:leading:shape:size:)/index.html"><code>init(LocalizedStringKey, tableName: String?, bundle: Bundle, category: Category, leading: Leading, shape: OUDSTag.Shape, size: OUDSTag.Size)</code></a><p>Creates a categorical tag with a localized label, looking up the key in the given bundle.</p></li><li><a href="init(label:category:leading:shape:size:)/index.html"><code>init(label: String, category: Category, leading: Leading, shape: OUDSTag.Shape, size: OUDSTag.Size)</code></a><p>Creates a categorical tag with a label and category.</p></li><li><a href="init(loadingkey:tablename:bundle:progress:category:shape:size:)/index.html"><code>init(loadingKey: LocalizedStringKey, tableName: String?, bundle: Bundle, progress: Double?, category: Category, shape: OUDSTag.Shape, size: OUDSTag.Size)</code></a><p>Creates a categorical tag in the loading state with a localized label, looking up the key in the given bundle.</p></li><li><a href="init(loadinglabel:progress:category:shape:size:)/index.html"><code>init(loadingLabel: String, progress: Double?, category: Category, shape: OUDSTag.Shape, size: OUDSTag.Size)</code></a><p>Creates a categorical tag in the loading state indicates that the system is processing or retrieving data. A circular progress indicator appears to inform the user that an action is in progress.</p></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Enumerations</h3><ul><li><a href="category/index.html"><code>enum Category</code></a><p>The category of a <code>OUDSCategoricalTag</code> determines the background color of the tag.</p></li><li><a href="leading/index.html"><code>enum Leading</code></a><p>The leading element of a <code>OUDSCategoricalTag</code>.</p></li></ul></article></noscript><div id="app"></div></body></html>

<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OUDSListItemImage</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="An icon element that can be used at the leading or trailing position of a list item such as ``doc://OUDSComponents/documentation/OUDSComponents/OUDSStaticListItem`` or ``doc://OUDSComponents/documentation/OUDSComponents/OUDSNavigationListItem``." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>OUDSListItemImage</li></ul><p>Structure</p><h1>OUDSListItemImage</h1><p>An icon element that can be used at the leading or trailing position of a list item such as <a href="../oudsstaticlistitem/index.html"><code>OUDSStaticListItem</code></a> or <a href="../oudsnavigationlistitem/index.html"><code>OUDSNavigationListItem</code></a>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct OUDSListItemImage</code></pre></section><h2>Overview</h2><p><a href="."><code>OUDSListItemImage</code></a> displays an image (square or wide).</p><h2>Sizes</h2><p>The <a href="size/index.html"><code>OUDSListItemImage.Size</code></a> enum defines the available sizes:</p><ul><li><p><b><code>.medium</code></b>: The default size, suited for standard list items.</p></li><li><p><b><code>.large</code></b>: A larger variant for increased visual prominence.</p></li><li><p><b><code>.extraLarge</code></b>: The largest variant, typically used for profile-like displays.</p></li></ul><p><b>Note:</b> When the image is embedded in a list item with small size (via <code>SwiftUI/View/oudsListItemSize(_:)</code>), the icon is always rendered at its smallest size.</p><h2>Code samples</h2><pre class="swift"><code>    // Decorative image
    OUDSListItemImage(asset: Image(decorative: "il_placeholder"))

    // Not decorative image
    OUDSListItemImage(asset: Image("meaningful_image"), description: "A nice landscape")

    // Not decorative image with large size
    OUDSListItemImage(asset: Image("meaningful_image"), description: "A nice landscape", size: .large)

    // Adjust with square ratio
    OUDSListItemImage(asset: Image("meaningful_image"), description: "A nice landscape", ration: .square)

    // Usage as leading element in a list item
    OUDSStaticListItem(
        data: OUDSListItemData(label: "Information"),
        leading: .image(.init(asset: Image(decorative: "il_placeholder", size: .medium))
    )

    // Usage as trailing element in a list item
    OUDSStaticListItem(
        data: OUDSListItemData(label: "Warning"),
        trailing: .image(.init(asset: Image(decorative: "il_placeholder", size: .medium))
    )
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(asset:description:size:ratio:contentmode:)/index.html"><code>init(asset: Image, description: String?, size: OUDSListItemImage.Size, ratio: OUDSListItemImage.Ratio, contentMode: ContentMode)</code><p>Creates an icon element for use in a list item at the leading or trailing position.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul><h3>Enumerations</h3><ul><li><a href="ratio/index.html"><code>enum Ratio</code><p>Defines the aspect ratio of the image container.</p></a></li><li><a href="size/index.html"><code>enum Size</code><p>Defines the available sizes (i.e. height) for the image. When the image is embedded in a list item with <code>.small</code> size, this parameter is ignored and a smallest size is always used.</p></a></li></ul></article></noscript><div id="app"></div></body></html>

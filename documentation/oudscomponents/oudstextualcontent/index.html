<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OUDSTextualContent</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A textual value that can be either a plain `String` or a styled `AttributedString`." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>OUDSTextualContent</li></ul><p>Enumeration</p><h1>OUDSTextualContent</h1><p>A textual value that can be either a plain <code>String</code> or a styled <code>AttributedString</code>.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@frozen enum OUDSTextualContent</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../contentdisplay/index.html">Content Display</a></li><li><a href="../navigations/index.html">Navigations</a></li></ul><h2>Overview</h2><p><code>OUDSTextualContent</code> is used by several OUDS components to let callers provide either a raw string or a user-styled rich text (<code>AttributedString</code>) through a single parameter. It conforms to <code>ExpressibleByStringLiteral</code> so a string literal is implicitly converted to the <a href="raw(_:)/index.html"><code>OUDSTextualContent.raw(_:)</code></a> case, keeping plain-text call sites concise.</p><pre class="swift"><code>    // Plain string literal (implicitly converted to .raw)
    let description: OUDSTextualContent = "A plain description"

    // Explicit raw string
    let overline: OUDSTextualContent = .raw("Overline")

    // User-styled rich text
    let helper: OUDSTextualContent = .rich(AttributedString("Styled helper"))
</code></pre><blockquote class="aside since"><p class="label">Since</p><p>3.2.0</p></blockquote><h2>Topics</h2><h3>Enumeration Cases</h3><ul><li><a href="localized(_:tablename:bundle:)/index.html"><code>case localized(LocalizedStringKey, tableName: String?, bundle: Bundle)</code><p>The text is loaded from localizables with a <code>LocalizedStringKey</code>, in a table with its name (default <code>nil</code>), from a <code>Bundle</code> (default <code>main</code>).</p></a></li><li><a href="raw(_:)/index.html"><code>case raw(String)</code><p>The text is a raw <code>String</code> to use as is.</p></a></li><li><a href="rich(_:)/index.html"><code>case rich(AttributedString)</code><p>The text is an <code>AttributedString</code>, a rich text whose styling (font, color, markdown…) is fully controlled by the caller.</p></a></li></ul><h3>Initializers</h3><ul><li><a href="init(stringliteral:)/index.html"><code>init(stringLiteral: String)</code><p>Creates a <a href="raw(_:)/index.html"><code>OUDSTextualContent.raw(_:)</code></a> value from a string literal.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="isempty/index.html"><code>var isEmpty: Bool</code><p>Whether the underlying text payload is empty.</p></a></li><li><a href="rawvalue/index.html"><code>var rawValue: String</code><p>Returns the text value of the element. Voice Over will be able to vocalize it, at least for <code>String</code> and <code>AttributedString(markdown:)</code> cases.</p></a></li></ul></article></noscript><div id="app"></div></body></html>

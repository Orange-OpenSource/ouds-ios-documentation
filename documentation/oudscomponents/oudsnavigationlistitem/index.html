<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>OUDSNavigationListItem</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.0b7dc663.js"></script><script defer="defer" src="/js/index.b232e9de.js"></script><link href="/css/index.19043b1e.css" rel="stylesheet"><meta content="A list item component used to display a row of interactive, navigable content within a list." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../index.html">Components</a></li><li>OUDSNavigationListItem</li></ul><p>Structure</p><h1>OUDSNavigationListItem</h1><p>A list item component used to display a row of interactive, navigable content within a list.</p><ul id="availability"><li>iOS 15.0+</li><li>macOS 13.0+</li><li>tvOS 16.0+</li><li>visionOS 1.0+</li><li>watchOS 11.0+</li></ul><pre><code>@MainActor struct OUDSNavigationListItem&lt;Slot&gt; where Slot : View</code></pre></section><h2>Mentioned In</h2><ul><li><a href="../navigations/index.html">Navigations</a></li></ul><h2>Overview</h2><p><a href="."><code>OUDSNavigationListItem</code></a> is an interactive variant of the list item that triggers an action when tapped. It displays a navigation indicator (chevron for next/previous, or an external link icon) to communicate the type of navigation to the user.</p><p>The item typically contains a label, and optionally a description, an overline, an extra label, and a helper text — all provided through <a href="../oudslistitemdata/index.html"><code>OUDSListItemData</code></a>. It can also include an optional leading element (such as an icon, image, avatar, or flag) and an optional trailing element (such as a text, badge, tag, icon, image, avatar or flag)</p><p>For non-interactive, display-only list items, see <a href="../oudsstaticlistitem/index.html"><code>OUDSStaticListItem</code></a>.</p><h2>Indicator types</h2><p>The <a href="../oudsnavigationlistitemindicatortype/index.html"><code>OUDSNavigationListItemIndicatorType</code></a> enum defines the visual indicator and semantic meaning of the navigation:</p><ul><li><p><b><code>.next</code></b> (default): A forward chevron indicating in-app navigation to a next screen.</p></li><li><p><b><code>.previous</code></b>: A backward chevron indicating in-app navigation to a previous screen. When using <code>.previous</code>, the leading element is automatically hidden.</p></li><li><p><b><code>.external</code></b>: An external link icon indicating that the action opens content outside the app (e.g. a URL in a browser or an external viewer).</p></li></ul><h2>Code samples</h2><pre class="swift"><code>    // Simple navigable list item with forward navigation
    OUDSNavigationListItem(
        data: OUDSListItemData(label: "Next screen")
    ) {
        // Navigate to next screen
    }

    // List item with external navigation
    OUDSNavigationListItem(
        data: OUDSListItemData(label: "Open website"),
        indicatorType: .external
    ) {
        openURL(url)
    }

    // List item with backward navigation
    OUDSNavigationListItem(
        data: OUDSListItemData(label: "Go back"),
        indicatorType: .previous
    ) {
        // Navigate back
    }

    // List item with leading avatar, trailing text, and forward navigation
    let avatar = OUDSListItemAvatar(type: .icon, size: .medium)

    OUDSNavigationListItem(
        data: OUDSListItemData(label: "Profile", description: "View your profile"),
        leading: .avatar(avatar),
        trailing: .text(.labelMuted(Text("Details")))
    ) {
        // Navigate to profile
    }
</code></pre><h2>Leading elements</h2><p>The leading position (before the texts) accepts one optional element via <a href="../oudslistitemleading/index.html"><code>OUDSListItemLeading</code></a>:</p><ul><li><p><code>.icon(OUDSListItemIcon)</code>: A status or custom icon (neutral, info, warning, negative, positive)</p></li><li><p><code>.image(OUDSListItemImage)</code>: A static image asset</p></li><li><p><code>.flag(OUDSListItemFlag)</code>: A country flag image</p></li><li><p><code>.avatar(OUDSListItemAvatar)</code>: An avatar with icon, initials, or image</p></li></ul><h2>Trailing elements</h2><p>The trailing position (after the texts) accepts one optional element via <a href="../oudslistitemtrailing/index.html"><code>OUDSListItemTrailing</code></a>, like:</p><ul><li><p><code>.text(.label(Text))</code>: A default-styled label</p></li><li><p><code>.text(.labelMuted(Text))</code>: A muted (secondary) label</p></li><li><p><code>.text(.labelStrong(Text))</code>: An emphasized (bold) label</p></li><li><p><code>.text(.labelAndExtraLabel(Text, Text))</code>: A label with an additional extra label below</p></li><li><p><code>.badge(.count(OUDSBadgeCount)</code>: A badge with count</p></li><li><p><code>.badge(.standard(OUDSBadgeStandard)</code>: A badge with standard status</p></li><li><p><code>.tag(OUDSTag)</code>: A tag for categorization</p></li><li><p><code>.icon(OUDSListItemIcon)</code>: A status or custom icon</p></li><li><p><code>.image(OUDSListItemImage)</code>:  A static image asset</p></li><li><p><code>.flag(OUDSListItemFlag)</code>: A country flag image</p></li><li><p><code>.avatar(OUDSListItemAvatar)</code>: An avatar with icon, initials, or image</p></li></ul><h2>View modifiers</h2><p>Several view modifiers can be applied to customize the appearance and layout of list items:</p><ul><li><p><a href="../swiftuicore/view/oudslistitemsize(_:)/index.html"><code>oudsListItemSize(_:)</code></a> — Sets the size of the item (<code>.standard</code> or <code>.small</code>).</p></li><li><p><a href="../swiftuicore/view/oudslistitemcontaineralignment(_:)/index.html"><code>oudsListItemContainerAlignment(_:)</code></a> — Aligns leading, trailing, and text containers (<code>.top</code> or <code>.center</code>).</p></li><li><p><a href="../swiftuicore/view/oudslistitemstyle(divider:background:)/index.html"><code>oudsListItemStyle(divider:background:)</code></a> — Applies a item style with optional divider and background.</p></li><li><p><a href="../swiftuicore/view/oudslistcardstyle(_:)/index.html"><code>oudsListCardStyle(_:)</code></a> — Applies a card style on list items.</p></li><li><p><a href="../swiftuicore/view/oudslistitemroundedmedia(_:)/index.html"><code>oudsListItemRoundedMedia(_:)</code></a> — Defines whether media (images) should be displayed with rounded corners.</p></li></ul><pre class="swift"><code>    OUDSNavigationListItem(
        data: OUDSListItemData(label: "Settings"),
        indicatorType: .next
    ) {
        // Navigate to settings
    }
    .oudsListItemSize(.small)
    .oudsListItemContainerAlignment(.top)
    .oudsListCardStyle(.outlined)
</code></pre><h2>Accessibility considerations</h2><p>You should test with Voice Over your <code>OUDSNavigationListItem</code> to check which parts are vocalized and if they are well vocalized, specially for the avatars, badges, tags and slot views.  Do not vocalize decorative elements.</p><p>If flags are used, do not suppose users know the flags and add in the texts parts of the <code>OUDSNavigationListItem</code> the country or region name.</p><p>Be sure the available texts are enough to explain to the users the navigation depending to its indicator type.</p><h2>Design documentation</h2><p><a href="https://r.orange.fr/r/S-ouds-doc-listitem">unified-design-system.orange.com</a></p><h2>Themes rendering</h2><h3>Orange</h3><p><picture><img alt="A list item component in light and dark modes with Orange theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/navigations/listitem/component_navigation_list_item_orange.png"/></picture></p><h3>Orange Compact</h3><p><picture><img alt="A list item component in light and dark modes with Orange Compact theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/navigations/listitem/component_navigation_list_item_orangecompact.png"/></picture></p><h3>Sosh</h3><p><picture><img alt="A list item component in light and dark modes with Sosh theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/navigations/listitem/component_navigation_list_item_sosh.png"/></picture></p><h3>Wireframe</h3><p><picture><img alt="A list item component in light and dark modes with Wireframe theme" decoding="async" loading="lazy" src="../../../users/pylapersonne/documents/2_projects/17-ouds/ouds-ios/ouds/core/components/sources/_oudscomponents.docc/resources/navigations/listitem/component_navigation_list_item_wireframe.png"/></picture></p><blockquote class="aside version"><p class="label">Version</p><p>1.0.0 (Figma component design version)</p></blockquote><blockquote class="aside since"><p class="label">Since</p><p>3.0.0</p></blockquote><h2>Topics</h2><h3>Initializers</h3><ul><li><a href="init(data:indicatortype:leading:trailing:action:)/index.html"><code>init(data: OUDSListItemData, indicatorType: OUDSNavigationListItemIndicatorType, leading: OUDSListItemLeading?, trailing: OUDSListItemTrailing?, action: (() -&gt; Void)?)</code><p>Creates a navigable list item with textual data, an indicator type, and an optional action but with no slot.</p></a></li><li><a href="init(data:slot:indicatortype:leading:trailing:action:)/index.html"><code>init(data: OUDSListItemData, slot: Slot, indicatorType: OUDSNavigationListItemIndicatorType, leading: OUDSListItemLeading?, trailing: OUDSListItemTrailing?, action: (() -&gt; Void)?)</code><p>Creates a navigable list item with textual data, an indicator type, and an optional action with additional slot. A slot (<code>View</code>) area is reserved under texts and before helper text.</p></a></li></ul><h3>Instance Properties</h3><ul><li><a href="body/index.html"><code>var body: some View</code></a></li></ul></article></noscript><div id="app"></div></body></html>

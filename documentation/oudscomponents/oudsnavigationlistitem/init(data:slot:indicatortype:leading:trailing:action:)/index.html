><dd><p>The type of navigation indicator to display. Defaults to <code>.next</code>. See <a href="../../oudsnavigationlistitemindicatortype/index.html"><code>OUDSNavigationListItemIndicatorType</code></a> for available options (previous, next and external).</p></dd><dt>leading</dt><dd><p>An optional element displayed at the leading position (before the texts). See <a href="../../oudslistitemleading/index.html"><code>OUDSListItemLeading</code></a> for available options (icon, image, flag, avatar). <b>Note:</b> Ignored when <code>indicatorType</code> is <code>.previous</code>.</p></dd><dt>trailing</dt><dd><p>An optional element displayed at the trailing position (after the texts). See <a href="../../oudslistitemtrailing/index.html"><code>OUDSListItemTrailing</code></a> for available options (text, badge, tag, icon, image, flag, avatar).</p></dd><dt>action</dt><dd><p>An optional closure triggered when the item is tapped.</p></dd></dl><h2>Discussion</h2><pre class="swift"><code>    let data = OUDSListItemData(label: "Label", description: "Description")
    OUDSNavigationListItem(data: data,

    }
</code></pre><blockquote class="aside note"><p class="label">Note</p><p>Leading, trailing, and text containers can be aligned using the <a href="../../swiftuicore/view/oudslistitemcontaineralignment(_:)/index.html"><code>oudsListItemContainerAlignment(_:)</code></a> view modifier.</p></blockquote></article></noscript><div id="app"></div></body></html>

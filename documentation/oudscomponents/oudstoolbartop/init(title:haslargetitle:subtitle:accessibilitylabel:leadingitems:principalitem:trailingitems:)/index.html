<!doctype html><html lang="en-US" class="no-js"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico"><link rel="mask-icon" href="/favicon.svg" color="#333333"><title>init(title:hasLargeTitle:subtitle:accessibilityLabel:leadingItems:principalItem:trailingItems:)</title><script>var baseUrl = "/"</script><script defer="defer" src="/js/chunk-vendors.88e02fc3.js"></script><script defer="defer" src="/js/index.f7bc5188.js"></script><link href="/css/index.63be42cf.css" rel="stylesheet"><meta content="`ViewModifier` to define an OUDS top toolbar." name="description"/></head><body data-color-scheme="auto"><noscript><article><section><ul><li><a href="../../index.html">Components</a></li><li><a href="../index.html">OUDSToolBarTop</a></li><li>init(title:hasLargeTitle:subtitle:accessibilityLabel:leadingItems:principalItem:trailingItems:)</li></ul><p>Initializer</p><h1>init(title:hasLargeTitle:subtitle:accessibilityLabel:leadingItems:principalItem:trailingItems:)</h1><p><code>ViewModifier</code> to define an OUDS top toolbar.</p><ul id="availability"><li>iOS 15.0+</li><li>visionOS 1.0+</li></ul><pre><code>@MainActor init(title: String, hasLargeTitle: Bool = false, subtitle: String? = nil, accessibilityLabel: String? = nil, leadingItems: @escaping () -&gt; [OUDSToolBarItem] = { [] }, principalItem: OUDSToolBarItem? = nil, trailingItems: @escaping () -&gt; [OUDSToolBarItem] = { [] })</code></pre></section><h2>Parameters</h2><dl><dt>title</dt><dd><p>The toolbar title. Prefer a non-empty string.</p></dd><dt>hasLargeTitle</dt><dd><p>If <i>title</i> must be displayed in large mode or not, <i>false</i> by default. If large mode, the <i>subtitle</i> is not displayed</p></dd><dt>subtitle</dt><dd><p>Optional <i>subtitle</i> displayed below the <i>title</i> if iOS 26+, <i>nil</i> by default. <b>Never displayed if <code>principalItem</code> is not <i>nil</i>.</b></p></dd><dt>accessibilityLabel</dt><dd><p>Optional label vocalized by VoiceOver instead of the <i>title</i> and the <i>subtitle</i>, <i>nil</i> by default, used if no large title nor principal item.</p></dd><dt>leadingItems</dt><dd><p>The items displayed on the leading side, <i>empty</i> by default.</p></dd><dt>principalItem</dt><dd><p>The item displayed in the principal (center) position, <i>nil</i> by default. Only one item is supported. If set, the <i>title</i> is displayed only if <code>hasLargeTitle</code> is <code>true</code>, and the <i>subtitle</i> is never displayed.</p></dd><dt>trailingItems</dt><dd><p>The items displayed on the trailing side, <i>empty</i> by default.</p></dd></dl><h2>Discussion</h2><p>You should prefer <code>toolBarTop(_:hasLargeTitle:subtitle:leadingItems:principalItem:trailingItems:)</code> on view placed inside <code>NavigationView</code> or<code>NavigationStack</code>.</p><pre class="swift"><code>    OUDSToolBarTop(title: "Home") {
        OUDSToolBarItem(navigation: .back { })
    },
    principalItem: OUDSToolBarItem(icon: Image(decorative: "search"), accessibilityLabel: "Search") { },
    trailingItems: {
        OUDSToolBarItem(label: "Done") { }
    }
</code></pre><p>The <i>top toolbar</i> can have an optional label vocalized by Voice Over for a particular case. Indeed, if there is no large title, and no element in principal item, the title and the subtitle can be hidden from Voice Over and the given accessibility label can be vocalized instead. However it is better to bring meaningfull texts in your navigation instead of tricking the UI with Voice Over dedicated values.</p></article></noscript><div id="app"></div></body></html>
